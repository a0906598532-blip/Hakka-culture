<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173e35"><title>客家文化知識平台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--green:#173e35;--lime:#d3e7a0;--ink:#192b26;--muted:#718078;--paper:#faf9f4;--line:#e4e6dc;--orange:#d87949}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",sans-serif}header{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(calc((100vw - 1100px)/2),24px)}.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.04em}.seal{background:var(--green);color:var(--lime);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px}.tag{border:1px solid var(--line);color:#65766d;border-radius:99px;padding:7px 13px;font-size:12px}.page{max-width:980px;margin:auto;padding:64px 24px 80px}.eyebrow{font-size:12px;letter-spacing:.18em;color:#74877c;font-weight:700}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:10px 0 32px}.hero h1{font-size:clamp(32px,5vw,52px);line-height:1.2;margin:0;color:var(--green);letter-spacing:-.04em}.hero p{color:var(--muted);margin:12px 0 0}.dialect{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}select{border:1px solid var(--line);background:white;color:var(--ink);border-radius:10px;padding:11px 35px 11px 13px;font:inherit}.card{background:white;border:1px solid var(--line);border-radius:24px;box-shadow:0 14px 45px #183b2d0b;overflow:hidden}.card-head{display:flex;justify-content:space-between;align-items:center;padding:22px 28px;border-bottom:1px solid #edf0e9}.chip{color:#5a725f;background:#f1f5e9;padding:6px 11px;border-radius:99px;font-size:12px}.count{font-size:12px;color:#89948c}.question{padding:36px 34px 30px}.question h2{font-size:clamp(23px,3.4vw,32px);line-height:1.55;margin:0 0 25px;max-width:760px}.answer{background:#f7f8f2;border-radius:15px;padding:19px 21px;margin-bottom:25px}.answer-label{font-size:11px;letter-spacing:.12em;color:#768178;font-weight:700}.answer-text{line-height:1.8;margin:6px 0 0;font-size:15px}.actions{display:flex;flex-wrap:wrap;gap:10px}.button{border:0;border-radius:11px;padding:12px 17px;font:600 14px inherit;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:.2s}.button:hover{transform:translateY(-1px)}.primary{background:var(--green);color:white}.secondary{background:#f1f3ed;color:var(--green)}.record{background:#fff2e9;color:#a94f28}.record.live{background:#c43d2f;color:white;animation:pulse 1.2s infinite}@keyframes pulse{50%{box-shadow:0 0 0 7px #c43d2f22}}.result{margin:20px 34px 30px;padding:18px 20px;border-radius:15px;background:#f5f7ed;display:none}.result.show{display:block}.score-row{display:flex;align-items:center;gap:15px}.score{font-size:35px;font-weight:800;color:var(--green)}.result p{margin:6px 0;color:#66766d;line-height:1.7}.status{font-size:13px;color:#748078;min-height:22px;margin-top:14px}.next-row{border-top:1px solid var(--line);padding:20px 28px;display:flex;justify-content:space-between;align-items:center}.next-row span{font-size:12px;color:#8a948d}.foot{font-size:12px;color:#98a098;text-align:center;margin-top:24px}.foot b{color:#718177}@media(max-width:650px){header{height:64px}.page{padding:42px 16px}.hero{display:block}.dialect{margin-top:20px}.question{padding:25px 21px}.card-head,.next-row{padding:17px 21px}.result{margin:16px 21px 23px}.button{flex:1}.tag{display:none}}
  </style>
</head>
<body>
  <header><div class="brand"><div class="seal">客</div><span>客家文化知識平台</span></div><span class="tag">聽・講・學</span></header>
  <main class="page">
    <div class="eyebrow">HAKKA CULTURE · LEARNING BY SPEAKING</div>
    <div class="hero"><div><h1>用客語，說文化。</h1><p>聽聽客家文化的小故事，再用客語說出你的答案。</p></div><label class="dialect">選擇腔調<select id="dialect"><option value="sixian">四縣腔</option><option value="hailu">海陸腔</option><option value="dapu">大埔腔</option><option value="raoping">饒平腔</option><option value="zhaoan">詔安腔</option><option value="nansixian">南四縣腔</option></select></label></div>
    <section class="card"><div class="card-head"><span class="chip" id="category">文化小知識</span><span class="count">每日一題　·　口說練習</span></div>
      <div class="question"><h2 id="question">載入題目中⋯</h2><div class="answer"><div class="answer-label">參考答案</div><p class="answer-text" id="answer"></p></div>
        <div class="actions"><button class="button primary" id="listen">▶　聽客語答案</button><button class="button record" id="record">●　開始錄音回答</button><button class="button secondary" id="score" disabled>✓　提交並評分</button></div>
        <div class="status" id="status" role="status"></div>
      </div><div class="result" id="result"><div class="score-row"><div class="score" id="scoreValue">—</div><b id="feedback"></b></div><p id="recognized"></p><p id="expected"></p></div>
      <div class="next-row"><span>用自己的話說說看，不必一字不差。</span><button class="button secondary" id="next">換一題　→</button></div>
    </section><div class="foot">語音服務由 <b>Gohakka Pro API</b> 提供　·　練習錄音只用於本次辨識</div>
  </main>
  <script>
    let current=null, recorder=null, chunks=[], recording=null;
    const $=id=>document.getElementById(id); const dialect=()=>$('dialect').value;
    function status(text){$('status').textContent=text}
    async function loadQuestion(){try{const r=await fetch('/api/question');current=await r.json();$('question').textContent=current.question;$('answer').textContent=current.answer;$('category').textContent=current.category;$('result').classList.remove('show');$('score').disabled=true;recording=null;status('');}catch(e){status('題目載入失敗，請重新整理頁面。')}}
    async function listen(){if(!current)return;status('正在準備客語語音⋯');$('listen').disabled=true;try{const r=await fetch('/api/speech',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answer:current.answer,dialect:dialect()})});const data=await r.json();if(!r.ok)throw Error(data.error);const audio=new Audio('data:audio/mpeg;base64,'+data.audio);audio.play();status('');}catch(e){status(e.message||'語音播放失敗。')}finally{$('listen').disabled=false}}
    async function toggleRecord(){if(recorder?.state==='recording'){recorder.stop();$('record').classList.remove('live');$('record').textContent='●　開始錄音回答';status('錄音完成，可以提交評分。');return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{recording=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});stream.getTracks().forEach(t=>t.stop());$('score').disabled=false};recorder.start();$('record').classList.add('live');$('record').textContent='■　停止錄音';status('正在錄音⋯');}catch(e){status('無法使用麥克風，請檢查瀏覽器權限。')}}
    async function submitScore(){if(!recording||!current)return;const form=new FormData();form.append('audio',recording,'answer.webm');form.append('questionId',current.id);form.append('dialect',dialect());status('正在辨識客語並計算分數⋯');$('score').disabled=true;try{const r=await fetch('/api/score',{method:'POST',body:form});const d=await r.json();if(!r.ok)throw Error(d.error);$('scoreValue').textContent=d.score+'分';$('feedback').textContent=d.feedback;$('recognized').textContent='辨識內容：'+(d.recognized||'（未辨識到語音）');$('expected').textContent='參考客語：'+d.expected;$('result').classList.add('show');status('');}catch(e){status(e.message||'評分失敗。')}finally{$('score').disabled=!recording}}
    $('listen').onclick=listen;$('record').onclick=toggleRecord;$('score').onclick=submitScore;$('next').onclick=loadQuestion;$('dialect').onchange=()=>{if(current)status('腔調已更新。')};loadQuestion();
  </script>
</body>
</html>
